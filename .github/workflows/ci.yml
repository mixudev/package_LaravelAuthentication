name: CI Tests & Static Analysis

on:
  push:
    branches: [ main, 1.x ]
  pull_request:
    branches: [ main, 1.x ]

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.*', '13.*']
        include:
          # Laravel 13 drops PHP 8.2 support, test with 8.3+ only
          - php: '8.2'
            laravel: '13.*'
            skip: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (pinned)

      - name: Skip Matrix Entry
        if: matrix.skip == true
        run: echo "Skipping PHP ${{ matrix.php }} with Laravel ${{ matrix.laravel }}" && exit 0

      - name: Setup PHP
        if: matrix.skip != true
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0 (pinned)
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, sqlite3, pdo_sqlite, bcmath, json
          coverage: none

      - name: Install Locked Dependencies
        if: matrix.skip != true
        run: |
          major="${{ matrix.laravel }}"
          major="${major%%.*}"
          lock_suffix=""
          if [ "$major" = "12" ] && [ "${{ matrix.php }}" = "8.2" ]; then
            lock_suffix="-php-8.2"
          fi
          cp ".github/ci/composer.laravel-${major}${lock_suffix}.json" composer.json
          cp ".github/ci/composer.laravel-${major}${lock_suffix}.lock" composer.lock
          composer install --prefer-dist --no-interaction --no-progress --no-scripts
          composer dump-autoload --no-interaction --no-scripts

      - name: Validate Composer
        if: matrix.skip != true
        run: composer validate --strict

      - name: Audit Dependencies
        if: matrix.skip != true
        run: composer audit --format=table

      - name: Execute Tests
        if: matrix.skip != true
        run: vendor/bin/phpunit --testdox

      - name: Execute Static Analysis
        if: matrix.skip != true
        run: vendor/bin/phpstan analyse --no-progress
